[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blocklog-verifier"
version = "2.0.0"
description = "Standalone cryptographic verifier for Blocklog execution receipts, transparency checkpoints, and witness attestations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Blocklog", email = "founder@blocklogsecurity.com" },
]
keywords = [
    "cryptography",
    "verification",
    "ed25519",
    "transparency",
    "merkle-tree",
    "rfc6962",
    "audit",
    "compliance",
    "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
blocklog-verify = "verifier.cli:main"

[tool.setuptools]
package-dir = {"verifier" = "."}
packages = ["verifier"]
