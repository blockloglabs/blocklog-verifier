name: Verifier CI

on:
  push:
    branches: [ main ]
    paths:
      - '**'
  pull_request:
    branches: [ main ]
    paths:
      - '**'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Run Standalone Verifier Tests
        run: |
          pytest tests/ -v

      - name: Test CLI Execution
        run: |
          blocklog-verify examples/witnessed_receipt.json \
            --trust-root-file examples/trust_roots.json \
            --witness-roots examples/witness_roots.json \
            --counterparty-roots examples/counterparty_roots.json \
            --json-output
